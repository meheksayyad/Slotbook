# Local development stack: Postgres 16, Redis 7, API, Celery worker, Celery beat.
x-app: &app
  build: .
  env_file: [.env.example]
  environment: &env
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes: [".:/app"]          # dev only: live code + generated migrations land on the host
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: slotbook, POSTGRES_USER: slotbook, POSTGRES_PASSWORD: slotbook}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}

  web:
    <<: *app
    environment: {<<: *env, RUN_MIGRATIONS: "1", AUTO_MAKEMIGRATIONS: "1"}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2
  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
