name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: slotbook, POSTGRES_USER: slotbook, POSTGRES_PASSWORD: slotbook}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slotbook" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-secret-key-for-tests-only-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=apps --cov-report=term-missing
